name: Build KIM ADDONS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        working-directory: mobile
        run: flutter create . --platforms android

      - name: Add url_launcher
        working-directory: mobile
        run: flutter pub add url_launcher

      - name: Add supabase_flutter
        working-directory: mobile
        run: flutter pub add "supabase_flutter:^2.15.4"

      - name: Add file_picker
        working-directory: mobile
        run: flutter pub add "file_picker:^8.3.7"

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KIM-ADDONS-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
